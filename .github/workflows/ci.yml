name: CI

on:
  push:
    branches: [main, "feat/**", "codex/**", "claude/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests (with coverage)
        run: npm run test:cov

      - name: Worker integration tests
        run: npm run test:workers

      - name: Importer and PWA tests
        run: npm run test:scripts

      - name: Production build (static export)
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  # Browser journeys against the real local Worker + D1 (tests/app.spec.ts). This is the
  # only layer that sees a service-worker install, an IndexedDB snapshot, a dialog's focus
  # order or a cookie the way a phone does. `continue-on-error` is deliberate while it beds
  # in (added 2026-09-21): an environment failure must not block a deploy that `verify` has
  # already proven green. Remove it once the job has been stable for two weeks.
  browser:
    name: Browser journeys (Chromium, local Worker)
    needs: verify
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      - name: Local-only auth secret
        run: printf 'BETTER_AUTH_SECRET=%s\n' "$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')" > .dev.vars

      # `wrangler dev` proxies the Workers AI binding to the edge even in local mode and
      # refuses to start without a login in a non-interactive runner. The journeys never
      # call AI, so they run against a generated config with that binding removed
      # (D1, email and rate limits stay). Migrations first: /api/health reads app_metadata.
      - name: CI Worker config (no remote bindings) + local D1 schema
        run: |
          node scripts/wrangler-ci-config.mjs
          npm run cf:migrate:local

      - name: Start the local Worker
        run: |
          set -uo pipefail
          npx wrangler dev --config wrangler.ci.json --port 8787 --log-level warn > wrangler-dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8787/api/health >/dev/null 2>&1; then echo "Worker is up"; exit 0; fi
            sleep 2
          done
          echo "::error::wrangler dev did not answer on :8787"; tail -50 wrangler-dev.log; exit 1

      - name: Run the browser journeys
        run: npx playwright test

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            wrangler-dev.log
          if-no-files-found: ignore
